<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Карточка ткани TexTrend — характеристики, фото, цена и заказ."><title>Товар • TexTrend</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/styles.css"><style>.product-page{padding:42px 0 90px}.breadcrumbs{font-size:13px;color:var(--muted);margin-bottom:22px}.breadcrumbs a{text-decoration:none;color:var(--green)}.product-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:55px}.mainimg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:#e8e7e1}.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.thumb{width:68px;height:68px;border-radius:5px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#eee}.thumb img{width:100%;height:100%;object-fit:cover}.thumb.active{border-color:var(--green)}.product-title{font-size:clamp(34px,4vw,52px);line-height:1.05;letter-spacing:-.04em;margin:0 0 15px}.product-price{font-size:25px;font-weight:850;margin:22px 0}.product-desc{font-size:16px;color:var(--muted);max-width:530px}.specs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:28px}.spec{padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.spec label{display:block;color:#89938f;font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px}.product-actions{display:flex;gap:10px;margin-top:28px}.product-actions .btn{flex:1}.note{font-size:12px;color:#89938f;margin-top:12px}.topbar{border-bottom:1px solid var(--line)}.topbar-inner{width:min(1180px,calc(100% - 40px));min-height:68px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{font-size:18px;font-weight:900;letter-spacing:.14em;text-decoration:none}.brand span{font-weight:500}.footer{background:var(--dark);padding:25px 0}.footer .wrap{color:#91a09a;font-size:12px}.footer a{color:#dce5e1}@media(max-width:800px){.product-grid{grid-template-columns:1fr;gap:30px}.product-page{padding-top:25px}.product-actions{flex-direction:column}}</style></head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="/">TEX<span>TREND</span></a><a class="btn primary" id="waTop" href="#" target="_blank" rel="noopener">Запросить цену</a></div></header>
<main class="product-page"><div class="wrap"><div class="breadcrumbs"><a href="/">Каталог</a> / <span id="bcName">Товар</span></div><div class="product-grid"><section><img id="mainImg" class="mainimg" alt=""><div id="thumbs" class="thumbs"></div></section><section><div class="eyebrow">TEXTREND COLLECTION</div><h1 id="title" class="product-title"></h1><div id="badges" class="badges"></div><div id="price" class="product-price"></div><p id="desc" class="product-desc"></p><div id="specs" class="specs"></div><div class="product-actions"><a id="waBtn" class="btn primary" href="#" target="_blank" rel="noopener">Заказать в WhatsApp →</a><a class="btn ghost" href="/">← Каталог</a></div><div class="note">Цена ориентировочная. Наличие, минимальный объём и условия поставки подтверждаются менеджером.</div></section></div></div></main>
<footer class="footer"><div class="wrap">TexTrend · Оптовые ткани из Турции · <a href="mailto:tex.trend34@gmail.com">tex.trend34@gmail.com</a></div></footer>
<script>const WA="https://wa.me/905471161988",id=new URLSearchParams(location.search).get("id");let PRODUCT=null,currentImage=null;const $=s=>document.querySelector(s);function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function boot(){try{const r=await fetch("/products.json?ts="+Date.now());if(!r.ok)throw Error("Не удалось загрузить каталог");const list=await r.json();PRODUCT=list.find(p=>p.id===id);if(!PRODUCT){$("#title").textContent="Товар не найден";return}render()}catch(e){$("#title").textContent="Ошибка загрузки";$("#desc").textContent=e.message}}function render(){document.title=(PRODUCT.name||"Товар")+" • TexTrend";$("#title").textContent=PRODUCT.name||PRODUCT.id;$("#bcName").textContent=PRODUCT.name||PRODUCT.id;const b=[PRODUCT.category,PRODUCT.kind,PRODUCT.print,PRODUCT.composition,PRODUCT.width_cm?PRODUCT.width_cm+" см":""].filter(Boolean);$("#badges").innerHTML=b.map(x=>`<span class="badge">${esc(x)}</span>`).join("");$("#price").textContent=PRODUCT.price_usd?`$${Number(PRODUCT.price_usd).toFixed(2)} / м`:"Цена по запросу";$("#desc").textContent=PRODUCT.description||"Ткань для производства и домашнего текстиля. Точные характеристики и наличие подтверждаются перед заказом.";const specs=[['Категория',PRODUCT.category],['Состав',PRODUCT.composition],['Ширина',PRODUCT.width_cm?PRODUCT.width_cm+' см':'—'],['Тип',PRODUCT.kind||'—'],['Печать',PRODUCT.print||'—'],['SKU',PRODUCT.sku||PRODUCT.id]].filter(x=>x[1]);$("#specs").innerHTML=specs.map(x=>`<div class="spec"><label>${esc(x[0])}</label>${esc(x[1])}</div>`).join("");const imgs=PRODUCT.images?.length?PRODUCT.images:[`/assets/img/${PRODUCT.id}.jpg`];currentImage=imgs[0];$("#mainImg").src=currentImage;$("#mainImg").onerror=()=>{$("#mainImg").src="/assets/placeholder.jpg"};const th=$("#thumbs");th.innerHTML="";imgs.forEach((src,i)=>{const d=document.createElement('div');d.className='thumb'+(i?'':' active');d.innerHTML='<img alt="">';d.firstChild.src=src;d.onclick=()=>{currentImage=src;$("#mainImg").src=src;[...th.children].forEach(x=>x.classList.remove('active'));d.classList.add('active');updateWA()};th.appendChild(d)});updateWA()}function buildWA(){let t=`Здравствуйте! Хочу заказать:\n• ${PRODUCT.name||PRODUCT.id}`;if(PRODUCT.sku)t+=`\n• SKU: ${PRODUCT.sku}`;if(PRODUCT.width_cm)t+=`\n• Ширина: ${PRODUCT.width_cm} см`;if(PRODUCT.composition)t+=`\n• Состав: ${PRODUCT.composition}`;if(PRODUCT.price_usd)t+=`\n• Цена: $${PRODUCT.price_usd} / м`;t+='\n• Количество: ___ м';return WA+'?text='+encodeURIComponent(t)}function updateWA(){const h=buildWA();$("#waBtn").href=h;$("#waTop").href=h}document.addEventListener('DOMContentLoaded',boot)</script></body></html>
